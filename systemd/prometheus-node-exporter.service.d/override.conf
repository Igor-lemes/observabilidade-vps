; Drop-in: corrige a corrida de boot entre o exporter e o tailscaled.
; Instalar em /etc/systemd/system/prometheus-node-exporter.service.d/override.conf.
;
; Problema: o exporter escuta no IP da VPN (--web.listen-address=10.0.0.10:PORTA,
; de propósito: não expõe a porta à internet). O unit do pacote Debian não
; declara ordem com o tailscaled; se o exporter sobe antes de a interface ter
; IP, o bind falha com "cannot assign requested address". Sintoma real:
; os dois exporters ficaram "failed" desde um boot e ninguém notou por 9 dias,
; porque os alertas de sonda dependem do próprio exporter (ver ExportadorForaDoAr).
;
; Conserto: After/Wants no tailscaled e StartLimitIntervalSec=0, para que a
; rajada de falhas dos primeiros segundos não esgote o limite de reinício e o
; systemd desista de vez. Restart=on-failure tenta de novo a cada 3 s.
;
; Aplicar (root):
;   mkdir -p /etc/systemd/system/prometheus-node-exporter.service.d
;   cp override.conf /etc/systemd/system/prometheus-node-exporter.service.d/
;   systemctl daemon-reload && systemctl reset-failed prometheus-node-exporter && systemctl restart prometheus-node-exporter

[Unit]
After=tailscaled.service
Wants=tailscaled.service
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=3
